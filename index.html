<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>个人日程</title>
<style>
  :root{
    --red:#A6192E; --red-dark:#8C1526; --bg:#FAF7F5; --card:#FFFFFF;
    --ink:#2B2320; --muted:#8A7F78; --line:#EDE4DE;
    --blue:#1F4E79; --green:#2E7D32;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0; font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
       background:var(--bg); color:var(--ink); min-height:100vh;}
  button{font-family:inherit;}

  /* ---------- 密码门 ---------- */
  #gate{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;}
  .gate-card{background:var(--card); border-radius:16px; padding:36px 28px; width:100%; max-width:380px;
             box-shadow:0 8px 30px rgba(60,20,25,.08); border-top:4px solid var(--red); text-align:center;}
  .gate-card .emblem{width:52px;height:52px;margin:0 auto 14px;border-radius:50%;background:var(--red);
             color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;}
  .gate-card h1{font-size:19px;margin:0 0 6px;}
  .gate-card p{font-size:13px;color:var(--muted);margin:0 0 20px;line-height:1.6;}
  .gate-card input{width:100%;padding:13px 14px;font-size:16px;border:1.5px solid var(--line);
             border-radius:10px;margin-bottom:12px;outline:none;text-align:center;letter-spacing:2px;}
  .gate-card input:focus{border-color:var(--red);}
  .gate-btn{width:100%;padding:13px;font-size:16px;font-weight:600;color:#fff;background:var(--red);
             border:none;border-radius:10px;cursor:pointer;}
  .gate-btn:active{background:var(--red-dark);}
  .gate-err{color:var(--red);font-size:13px;min-height:18px;margin:2px 0 8px;}
  .remember{display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;color:var(--muted);margin-bottom:14px;}
  .remember input{width:auto;margin:0;}
  .gate-tip{font-size:12px;color:var(--muted);margin-top:16px;line-height:1.6;}

  /* ---------- 主界面 ---------- */
  #app{display:none; max-width:640px; margin:0 auto; padding:0 0 90px;}
  header{background:var(--red); color:#fff; padding:14px 16px; display:flex; align-items:center; gap:10px;
         position:sticky; top:0; z-index:10; box-shadow:0 2px 8px rgba(0,0,0,.12);}
  header .title{font-size:17px; font-weight:700; flex:1;}
  #syncDot{display:flex;align-items:center;gap:5px;font-size:12px;opacity:.95;}
  #syncDot .dot{width:8px;height:8px;border-radius:50%;background:#7CFC9A;}
  #syncDot.syncing .dot{background:#FFD54F;}
  #syncDot.error .dot{background:#FF8A80;}
  #lockBtn{background:rgba(255,255,255,.18);border:none;color:#fff;font-size:12px;padding:6px 10px;border-radius:8px;cursor:pointer;}

  /* 月历 */
  #calCard{background:var(--card);margin:14px 14px 0;border-radius:14px;padding:14px;box-shadow:0 2px 10px rgba(60,20,25,.05);}
  #calHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  #calHead .ym{font-size:16px;font-weight:700;}
  #calHead button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 12px;font-size:14px;color:var(--ink);cursor:pointer;}
  #weekRow,#calGrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
  #weekRow div{text-align:center;font-size:12px;color:var(--muted);padding:4px 0;}
  .day{aspect-ratio:1/1;display:flex;flex-direction:column;align-items:center;justify-content:center;
       border-radius:10px;font-size:14px;cursor:pointer;position:relative;border:none;background:transparent;color:var(--ink);}
  .day.other{color:#C9BFB8;}
  .day.today{font-weight:700;color:var(--red);}
  .day.sel{background:var(--red);color:#fff;}
  .day.sel.today{color:#fff;}
  .dots{display:flex;gap:3px;margin-top:3px;height:5px;}
  .dots i{width:5px;height:5px;border-radius:50%;display:block;}

  /* 当日任务 */
  #daySec{margin:14px;}
  #dayTitle{font-size:15px;font-weight:700;margin:4px 2px 10px;display:flex;align-items:baseline;gap:8px;}
  #dayTitle .sub{font-size:12px;color:var(--muted);font-weight:400;}
  .task{background:var(--card);border-radius:12px;padding:12px 14px;margin-bottom:10px;display:flex;gap:10px;
        box-shadow:0 2px 8px rgba(60,20,25,.05);border-left:4px solid var(--red);cursor:pointer;}
  .task[data-cat="work"]{border-left-color:var(--blue);}
  .task[data-cat="personal"]{border-left-color:var(--green);}
  .task .chk{width:22px;height:22px;border:2px solid var(--line);border-radius:50%;flex-shrink:0;margin-top:2px;
        display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;background:#fff;}
  .task.done .chk{background:var(--green);border-color:var(--green);}
  .task.done .t-title{text-decoration:line-through;color:var(--muted);}
  .task .t-body{flex:1;min-width:0;}
  .t-top{display:flex;align-items:center;gap:8px;}
  .t-time{font-size:13px;font-weight:700;color:var(--red);font-variant-numeric:tabular-nums;}
  .task[data-cat="work"] .t-time{color:var(--blue);}
  .task[data-cat="personal"] .t-time{color:var(--green);}
  .t-title{font-size:15px;font-weight:600;flex:1;word-break:break-all;}
  .t-cat{font-size:11px;padding:2px 8px;border-radius:20px;flex-shrink:0;}
  .t-cat.party{background:#FBE9EC;color:var(--red);}
  .t-cat.work{background:#E8F0F8;color:var(--blue);}
  .t-cat.personal{background:#E9F4EA;color:var(--green);}
  .t-note{font-size:13px;color:var(--muted);margin-top:4px;white-space:pre-wrap;word-break:break-all;}
  #emptyDay{text-align:center;color:var(--muted);font-size:13px;padding:26px 0;background:var(--card);border-radius:12px;
        border:1.5px dashed var(--line);}

  /* 近期提醒 */
  #upSec{margin:16px 14px 0;}
  #upSec h2{font-size:14px;margin:0 2px 8px;color:var(--muted);font-weight:600;}
  .up-item{background:var(--card);border-radius:10px;padding:9px 12px;margin-bottom:7px;font-size:13px;
        display:flex;gap:8px;align-items:center;box-shadow:0 1px 6px rgba(60,20,25,.04);cursor:pointer;}
  .up-date{font-weight:700;color:var(--red);flex-shrink:0;font-variant-numeric:tabular-nums;}

  /* 添加按钮 */
  #addBtn{position:fixed;right:18px;bottom:calc(24px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;
        background:var(--red);color:#fff;font-size:30px;border:none;box-shadow:0 6px 16px rgba(166,25,46,.35);
        cursor:pointer;line-height:1;z-index:20;}
  #addBtn:active{background:var(--red-dark);}

  /* 编辑弹层 */
  #modalMask{position:fixed;inset:0;background:rgba(30,15,18,.45);display:none;z-index:30;
        align-items:flex-end;justify-content:center;}
  #modal{background:#fff;width:100%;max-width:640px;border-radius:18px 18px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));
        max-height:88vh;overflow-y:auto;}
  #modal h3{margin:0 0 16px;font-size:17px;}
  .f-row{margin-bottom:14px;}
  .f-row label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;}
  .f-row input,.f-row textarea{width:100%;padding:11px 12px;font-size:15px;border:1.5px solid var(--line);
        border-radius:10px;outline:none;font-family:inherit;}
  .f-row input:focus,.f-row textarea:focus{border-color:var(--red);}
  .f-row textarea{resize:vertical;min-height:64px;}
  .cat-row{display:flex;gap:8px;}
  .cat-opt{flex:1;padding:10px 0;text-align:center;border:1.5px solid var(--line);border-radius:10px;
        font-size:14px;cursor:pointer;background:#fff;}
  .cat-opt.on[data-v="party"]{border-color:var(--red);background:#FBE9EC;color:var(--red);font-weight:600;}
  .cat-opt.on[data-v="work"]{border-color:var(--blue);background:#E8F0F8;color:var(--blue);font-weight:600;}
  .cat-opt.on[data-v="personal"]{border-color:var(--green);background:#E9F4EA;color:var(--green);font-weight:600;}
  .m-btns{display:flex;gap:10px;margin-top:6px;}
  .m-btns button{flex:1;padding:13px;font-size:15px;border-radius:10px;border:none;cursor:pointer;font-weight:600;}
  #saveBtn{background:var(--red);color:#fff;}
  #cancelBtn{background:#F3EDEA;color:var(--ink);}
  #delBtn{background:#fff;color:var(--red);border:1.5px solid var(--red)!important;flex:0 0 84px;display:none;}
  #toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:rgba(30,20,22,.85);color:#fff;
        padding:9px 18px;border-radius:20px;font-size:13px;display:none;z-index:40;}
  footer{text-align:center;font-size:11px;color:var(--muted);margin-top:24px;line-height:1.7;}
</style>
</head>
<body>

<!-- 密码门 -->
<div id="gate">
  <div class="gate-card">
    <div class="emblem">日</div>
    <h1 id="gateTitle">个人日程</h1>
    <p id="gateDesc">请输入密码进入</p>
    <div class="gate-err" id="gateErr"></div>
    <input type="password" id="pw1" placeholder="密码" autocomplete="current-password">
    <input type="password" id="pw2" placeholder="再输一次确认" style="display:none" autocomplete="new-password">
    <label class="remember" id="rememberRow"><input type="checkbox" id="rememberChk" checked>在这台设备上记住登录</label>
    <button class="gate-btn" id="gateBtn">进 入</button>
    <div class="gate-tip">🔒 所有日程经密码加密后才上传同步，<br>服务器上只存密文，其他人拿到链接也看不到内容。</div>
  </div>
</div>

<!-- 主界面 -->
<div id="app">
  <header>
    <div class="title">个人日程</div>
    <div id="syncDot"><span class="dot"></span><span id="syncTxt">已同步</span></div>
    <button id="lockBtn">🔒 退出</button>
  </header>

  <div id="calCard">
    <div id="calHead">
      <button id="prevM">‹ 上月</button>
      <div class="ym" id="ymLabel"></div>
      <button id="nextM">下月 ›</button>
    </div>
    <div id="weekRow"><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div><div>日</div></div>
    <div id="calGrid"></div>
  </div>

  <div id="daySec">
    <div id="dayTitle"></div>
    <div id="dayList"></div>
  </div>

  <div id="upSec"><h2>📌 即将到来</h2><div id="upList"></div></div>

  <footer>本页为私人日程 · 数据加密存储 · 请勿转发链接</footer>
</div>

<button id="addBtn" style="display:none">＋</button>

<!-- 编辑弹层 -->
<div id="modalMask">
  <div id="modal">
    <h3 id="modalTitle">添加任务</h3>
    <div class="f-row"><label>日期</label><input type="date" id="fDate"></div>
    <div class="f-row"><label>时间（可不填）</label><input type="time" id="fTime"></div>
    <div class="f-row"><label>事项</label><input type="text" id="fTitle" placeholder="如：支部党员大会"></div>
    <div class="f-row"><label>分类</label>
      <div class="cat-row">
        <div class="cat-opt on" data-v="party">党团</div>
        <div class="cat-opt" data-v="work">工作</div>
        <div class="cat-opt" data-v="personal">个人</div>
      </div>
    </div>
    <div class="f-row"><label>备注（地点、注意事项等，可不填）</label><textarea id="fNote" placeholder="如：教三 3205，带笔记本"></textarea></div>
    <div class="m-btns">
      <button id="delBtn">删除</button>
      <button id="cancelBtn">取消</button>
      <button id="saveBtn">保存</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
/* ================= 配置（部署时注入） ================= */
const GIST_ID   = "0f8a99122a531fae448c779ad444c591";
const GIST_FILE = "store.json";
// token 分段 base64 存放（仅 gist 权限；数据已加密，拿到 token 也读不到内容）
const GH_TOKEN  = (()=>{ const a="Z2hvX2NRY1AxTWtia0cwQkpJTDRC", b="eHdyUDBERUk4azlSUzFtUEdSTg=="; return atob(a+b); })();
const LS_KEY    = "pd_schedule_key_v1";

/* ================= 工具 ================= */
const $ = id => document.getElementById(id);
const b64e = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const todayStr = () => fmtDate(new Date());
function fmtDate(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function toast(msg){ const t=$("toast"); t.textContent=msg; t.style.display="block"; clearTimeout(t._tm); t._tm=setTimeout(()=>t.style.display="none",1800); }

/* ================= 加密（PBKDF2 + AES-GCM） ================= */
let aesKey = null;
async function deriveKey(pw, salt){
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", salt, iterations:150000, hash:"SHA-256"},
        base, {name:"AES-GCM", length:256}, false, ["encrypt","decrypt"]);
}
async function encObj(key, obj){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name:"AES-GCM", iv}, key, new TextEncoder().encode(JSON.stringify(obj)));
  return {iv:b64e(iv), c:b64e(ct)};
}
async function decObj(key, pack){
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64d(pack.iv)}, key, b64d(pack.c));
  return JSON.parse(new TextDecoder().decode(pt));
}

/* ================= 云端存储（GitHub Gist） ================= */
const gistApi = "https://api.github.com/gists/"+GIST_ID;
async function cloudLoad(){
  const r = await fetch(gistApi, {headers:{"Accept":"application/vnd.github+json"}});
  if(!r.ok) throw new Error("load "+r.status);
  const g = await r.json();
  const f = g.files && g.files[GIST_FILE];
  if(!f) return null;
  return JSON.parse(f.content);
}
async function cloudSave(store){
  const r = await fetch(gistApi, {method:"PATCH",
    headers:{"Authorization":"token "+GH_TOKEN,"Accept":"application/vnd.github+json","Content-Type":"application/json"},
    body: JSON.stringify({files:{[GIST_FILE]:{content:JSON.stringify(store)}}})});
  if(!r.ok) throw new Error("save "+r.status);
}

/* ================= 状态 ================= */
let tasks = [];          // {id,date,time,title,cat,note,done}
let curMonth = new Date(); curMonth.setDate(1);
let selDate = todayStr();
let editId = null, fCat = "party";
let saveTimer = null;

function setSync(state, txt){
  const d=$("syncDot"); d.className = state==="ok"?"":state;
  $("syncTxt").textContent = txt;
}
function scheduleSave(){
  setSync("syncing","同步中…");
  clearTimeout(saveTimer);
  saveTimer = setTimeout(pushAll, 700);
}
async function pushAll(){
  try{
    const saltB64 = localStorage.getItem(LS_KEY+"_salt");
    const salt = b64d(saltB64);
    const store = {v:1, salt:saltB64,
      ver: await encObj(aesKey, "SCHEDULE-OK"),
      data: await encObj(aesKey, tasks)};
    await cloudSave(store);
    localStorage.setItem(LS_KEY+"_cache", JSON.stringify(store));
    setSync("ok","已同步");
  }catch(e){
    setSync("error","未同步(网络)");
  }
}

/* ================= 密码门 ================= */
let isSetup = false, gateSalt = null;
async function initGate(){
  $("app").style.display="none"; $("addBtn").style.display="none"; $("gate").style.display="flex";
  // 记住登录：直接恢复 key
  const savedKey = localStorage.getItem(LS_KEY+"_jwk");
  const cached = localStorage.getItem(LS_KEY+"_cache");
  if(savedKey && cached){
    try{
      const raw = Uint8Array.from(atob(savedKey), c=>c.charCodeAt(0));
      aesKey = await crypto.subtle.importKey("raw", raw, {name:"AES-GCM"}, false, ["encrypt","decrypt"]);
      const store = JSON.parse(cached);
      const v = await decObj(aesKey, store.ver);
      if(v === "SCHEDULE-OK"){ tasks = await decObj(aesKey, store.data); enterApp(); backgroundPull(); return; }
    }catch(e){ localStorage.removeItem(LS_KEY+"_jwk"); }
  }
  // 拉取云端判断首次/输入密码
  try{
    const store = await cloudLoad();
    if(store && store.salt){
      isSetup = false; gateSalt = b64d(store.salt);
      localStorage.setItem(LS_KEY+"_salt", store.salt);
      localStorage.setItem(LS_KEY+"_cache", JSON.stringify(store));
      $("gateDesc").textContent = "请输入密码进入";
      $("pw2").style.display="none";
      $("gateBtn").textContent = "进 入";
      $("gateTitle").textContent = "个人日程";
    }else{
      setupMode();
    }
  }catch(e){
    // 网络失败：用本地缓存进入
    if(cached){
      const store = JSON.parse(cached);
      isSetup=false; gateSalt=b64d(store.salt);
      $("gateDesc").textContent="离线模式 · 请输入密码";
      $("pw2").style.display="none"; $("gateBtn").textContent="进 入";
    }else{
      $("gateDesc").textContent="网络异常，请检查网络后刷新";
      $("gateBtn").textContent="重 试";
      $("gateBtn").onclick = ()=>location.reload();
      return;
    }
  }
  $("gateBtn").onclick = onGateSubmit;
  $("pw1").onkeydown = e=>{ if(e.key==="Enter") onGateSubmit(); };
  $("pw2").onkeydown = e=>{ if(e.key==="Enter") onGateSubmit(); };
}
function setupMode(){
  isSetup = true;
  $("gateTitle").textContent = "首次使用 · 设置密码";
  $("gateDesc").textContent = "这个密码只有你知道，请务必记住\n（忘记密码将无法恢复日程）";
  $("pw1").placeholder = "设置一个密码"; $("pw1").autocomplete="new-password";
  $("pw2").style.display="block";
  $("gateBtn").textContent = "设置并进入";
  $("gateBtn").onclick = onGateSubmit;
}
async function onGateSubmit(){
  $("gateErr").textContent = "";
  const pw = $("pw1").value;
  if(pw.length < 4){ $("gateErr").textContent="密码至少 4 位"; return; }
  if(isSetup){
    if(pw !== $("pw2").value){ $("gateErr").textContent="两次输入不一致"; return; }
    gateSalt = crypto.getRandomValues(new Uint8Array(16));
    localStorage.setItem(LS_KEY+"_salt", b64e(gateSalt));
    aesKey = await deriveKey(pw, gateSalt);
    tasks = [];
    enterApp();
    maybeRemember();
    await pushAll();
    toast("密码设置成功");
  }else{
    aesKey = await deriveKey(pw, gateSalt);
    try{
      const cached = JSON.parse(localStorage.getItem(LS_KEY+"_cache"));
      const v = await decObj(aesKey, cached.ver);
      if(v !== "SCHEDULE-OK") throw 0;
      tasks = await decObj(aesKey, cached.data);
      enterApp(); maybeRemember(); backgroundPull();
    }catch(e){
      $("gateErr").textContent = "密码不正确，请重试";
      aesKey = null;
    }
  }
}
async function maybeRemember(){ /* 在下方重定义（派生 key 需可导出） */ }
</script>
<script>
/* 派生时使用可导出 key（用于"记住登录"），并覆盖上面的占位函数 */
const _deriveKey = deriveKey;
deriveKey = async function(pw, salt){
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", salt, iterations:150000, hash:"SHA-256"},
        base, {name:"AES-GCM", length:256}, true, ["encrypt","decrypt"]);
};
maybeRemember = async function(){
  if(!$("rememberChk").checked){ localStorage.removeItem(LS_KEY+"_jwk"); return; }
  const raw = await crypto.subtle.exportKey("raw", aesKey);
  localStorage.setItem(LS_KEY+"_jwk", b64e(raw));
};

/* ================= 主界面渲染 ================= */
const CAT_NAME = {party:"党团", work:"工作", personal:"个人"};
const CAT_COLOR = {party:"#A6192E", work:"#1F4E79", personal:"#2E7D32"};

function enterApp(){
  $("gate").style.display="none";
  $("app").style.display="block";
  $("addBtn").style.display="block";
  setSync("ok","已同步");
  renderAll();
}
async function backgroundPull(){
  try{
    const store = await cloudLoad();
    if(!store || !store.ver) return;
    const v = await decObj(aesKey, store.ver);
    if(v === "SCHEDULE-OK"){
      tasks = await decObj(aesKey, store.data);
      localStorage.setItem(LS_KEY+"_cache", JSON.stringify(store));
      renderAll(); setSync("ok","已同步");
    }
  }catch(e){ /* 保持本地 */ }
}
function renderAll(){ renderCal(); renderDay(); renderUpcoming(); }

function renderCal(){
  const y = curMonth.getFullYear(), m = curMonth.getMonth();
  $("ymLabel").textContent = y+" 年 "+(m+1)+" 月";
  const first = new Date(y, m, 1);
  const startOffset = (first.getDay()+6)%7; // 周一为首
  const daysIn = new Date(y, m+1, 0).getDate();
  const prevDays = new Date(y, m, 0).getDate();
  const grid = $("calGrid"); grid.innerHTML = "";
  const total = Math.ceil((startOffset+daysIn)/7)*7;
  for(let i=0;i<total;i++){
    const btn = document.createElement("button"); btn.className="day";
    let dObj, other=false;
    if(i < startOffset){ dObj = new Date(y, m-1, prevDays-(startOffset-1-i)); other=true; }
    else if(i >= startOffset+daysIn){ dObj = new Date(y, m+1, i-startOffset-daysIn+1); other=true; }
    else{ dObj = new Date(y, m, i-startOffset+1); }
    const ds = fmtDate(dObj);
    btn.textContent = dObj.getDate();
    if(other) btn.classList.add("other");
    if(ds === todayStr()) btn.classList.add("today");
    if(ds === selDate) btn.classList.add("sel");
    const dayTasks = tasks.filter(t=>t.date===ds);
    if(dayTasks.length){
      const dots = document.createElement("span"); dots.className="dots";
      [...new Set(dayTasks.map(t=>t.cat))].slice(0,3).forEach(c=>{
        const i2=document.createElement("i"); i2.style.background=CAT_COLOR[c]; dots.appendChild(i2);
      });
      btn.appendChild(dots);
    }
    btn.onclick = ()=>{
      selDate = ds;
      if(other){ curMonth = new Date(dObj.getFullYear(), dObj.getMonth(), 1); }
      renderAll();
    };
    grid.appendChild(btn);
  }
}
function renderDay(){
  const d = new Date(selDate+"T00:00:00");
  const wk = ["日","一","二","三","四","五","六"][d.getDay()];
  $("dayTitle").innerHTML = (d.getMonth()+1)+"月"+d.getDate()+"日 周"+wk +
    (selDate===todayStr()?'<span class="sub">今天</span>':"");
  const list = tasks.filter(t=>t.date===selDate).sort((a,b)=>(a.time||"99")<(b.time||"99")?-1:1);
  const box = $("dayList"); box.innerHTML="";
  if(!list.length){
    box.innerHTML = '<div id="emptyDay">这一天还没有安排<br>点右下角 ＋ 添加</div>';
    return;
  }
  list.forEach(t=> box.appendChild(taskEl(t)));
}
function taskEl(t){
  const el = document.createElement("div");
  el.className = "task"+(t.done?" done":""); el.dataset.cat = t.cat;
  el.innerHTML =
    '<div class="chk">'+(t.done?"✓":"")+'</div>'+
    '<div class="t-body"><div class="t-top">'+
    (t.time?'<span class="t-time">'+t.time+'</span>':"")+
    '<span class="t-title"></span>'+
    '<span class="t-cat '+t.cat+'">'+CAT_NAME[t.cat]+'</span></div>'+
    (t.note?'<div class="t-note"></div>':"")+'</div>';
  el.querySelector(".t-title").textContent = t.title;
  if(t.note) el.querySelector(".t-note").textContent = t.note;
  el.querySelector(".chk").onclick = e=>{
    e.stopPropagation(); t.done=!t.done; renderAll(); scheduleSave();
  };
  el.onclick = ()=> openModal(t);
  return el;
}
function renderUpcoming(){
  const box = $("upList"); box.innerHTML="";
  const now = todayStr();
  const up = tasks.filter(t=>t.date>=now && !t.done)
      .sort((a,b)=> a.date===b.date ? (a.time||"99")<(b.time||"99")?-1:1 : a.date<b.date?-1:1)
      .slice(0,5);
  if(!up.length){ box.innerHTML='<div style="font-size:13px;color:var(--muted);padding:4px 2px;">暂无待办安排</div>'; return; }
  up.forEach(t=>{
    const el = document.createElement("div"); el.className="up-item";
    const d = t.date.slice(5).replace("-","月")+"日";
    el.innerHTML = '<span class="up-date">'+d+'</span>'+
      (t.time?'<span style="color:var(--muted)">'+t.time+'</span>':"")+
      '<span style="flex:1" class="up-t"></span>'+
      '<span class="t-cat '+t.cat+'">'+CAT_NAME[t.cat]+'</span>';
    el.querySelector(".up-t").textContent = t.title;
    el.onclick = ()=>{ selDate=t.date; curMonth=new Date(+t.date.slice(0,4), +t.date.slice(5,7)-1, 1); renderAll(); window.scrollTo({top:0,behavior:"smooth"}); };
    box.appendChild(el);
  });
}

/* ================= 弹层编辑 ================= */
function openModal(task){
  editId = task ? task.id : null;
  $("modalTitle").textContent = task ? "编辑任务" : "添加任务";
  $("fDate").value = task ? task.date : selDate;
  $("fTime").value = task ? (task.time||"") : "";
  $("fTitle").value = task ? task.title : "";
  $("fNote").value  = task ? (task.note||"") : "";
  fCat = task ? task.cat : "party";
  document.querySelectorAll(".cat-opt").forEach(o=>o.classList.toggle("on", o.dataset.v===fCat));
  $("delBtn").style.display = task ? "block" : "none";
  $("modalMask").style.display = "flex";
}
function closeModal(){ $("modalMask").style.display="none"; }
document.querySelectorAll(".cat-opt").forEach(o=> o.onclick = ()=>{
  fCat = o.dataset.v;
  document.querySelectorAll(".cat-opt").forEach(x=>x.classList.toggle("on", x===o));
});
$("addBtn").onclick = ()=>openModal(null);
$("cancelBtn").onclick = closeModal;
$("modalMask").onclick = e=>{ if(e.target===$("modalMask")) closeModal(); };
$("saveBtn").onclick = ()=>{
  const title = $("fTitle").value.trim();
  if(!title){ toast("请填写事项内容"); return; }
  const data = {date:$("fDate").value||selDate, time:$("fTime").value, title,
                cat:fCat, note:$("fNote").value.trim()};
  if(editId){
    const t = tasks.find(x=>x.id===editId);
    Object.assign(t, data);
  }else{
    tasks.push(Object.assign({id:Date.now()+"-"+Math.random().toString(36).slice(2,7), done:false}, data));
  }
  selDate = data.date;
  curMonth = new Date(+data.date.slice(0,4), +data.date.slice(5,7)-1, 1);
  closeModal(); renderAll(); scheduleSave();
  toast("已保存");
};
$("delBtn").onclick = ()=>{
  if(!editId) return;
  if(!confirm("确定删除这条任务吗？")) return;
  tasks = tasks.filter(x=>x.id!==editId);
  closeModal(); renderAll(); scheduleSave();
  toast("已删除");
};

/* ================= 其他 ================= */
$("prevM").onclick = ()=>{ curMonth.setMonth(curMonth.getMonth()-1); renderCal(); };
$("nextM").onclick = ()=>{ curMonth.setMonth(curMonth.getMonth()+1); renderCal(); };
$("lockBtn").onclick = ()=>{
  if(confirm("退出并清除本设备上的记住登录？（日程本身保存在云端，不会丢失）")){
    localStorage.removeItem(LS_KEY+"_jwk");
    aesKey=null; tasks=[]; location.reload();
  }
};
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden && aesKey) backgroundPull(); });

initGate();
</script>
